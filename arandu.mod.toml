# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the application
# and never opens an installed package, so tests/Unit/audit_test.go is what
# compares these four lines with what the code calls.

name = "hyz-is/turnstile"
# This package imports no framework package; it requires Hesape v0.85.0, and
# Framework v0.66.0 is the first release built on that Hesape. An application
# on an older Framework would have its Hesape raised past the one it was built
# with by installing this.
framework = ">= 0.66"
profiles = ["conventional", "performance"]

[permissions]
# It asks Cloudflare about one token per submission: one POST to
# https://challenges.cloudflare.com/turnstile/v0/siteverify, and nothing else.
network = true
# It reads no file and writes none; the script it serves is compiled in.
filesystem = false
# It runs no other program.
exec = false
# It owns no table: a token is verified once and forgotten.
migrations = false
